; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; name       --> board
; esp01s  1M --> d1_mini_lite
; esp01s 16M --> d1_mini_pro
; esp12f  4M --> d1
; esp12f  4M --> nodemcuv2

[platformio]
name = Home Smart
description = Some Apple HomeKit firmwares for Victoria 9#
; src_dir = apps/$PIOENV/src/
; lib_dir = apps/$PIOENV/lib/
; include_dir = apps/$PIOENV/include/
; data_dir = apps/$PIOENV/data/
; test_dir = apps/$PIOENV/test/
; default_envs = opple-fe6300

[env]
upload_speed = 460800
monitor_speed = 115200
; upload_port = /dev/cu.usbserial-210
; monitor_port = /dev/cu.usbserial-210
; monitor_filters = send_on_enter
; monitor_echo = yes
extra_scripts = 
  pre:scripts/pre_script.py
  post:scripts/post_script.py
build_flags = 
  -D BUILD_ENV_NAME=$PIOENV
  -D UNIX_TIME=1577808000 ; $UNIX_TIME | 1577808000 ; date fixed at 2020 01/01 00:00:00
  -D VICTOR_DEBUG ; VICTOR_DEBUG | VICTOR_RELEASE
  ; firmware config
  '-D VICTOR_FIRMWARE_MANUFACTURER="RuleeSmart Co.,Ltd."'
  ; homekit config
  -D HOMEKIT_LOG_LEVEL=2 ; 0:Off | 1:ERROR | 2:INFO | 3:DEBUG
  '-D VICTOR_ACCESSORY_INFORMATION_MANUFACTURER="RuleeSmart Co.,Ltd."'
  '-D VICTOR_ACCESSORY_SERVER_PASSWORD="198-21-220"'

[env:home-victor]
; extends = env
platform = espressif8266@4.2.1
framework = arduino
board = d1_mini_lite
board_build.filesystem = littlefs
lib_deps = 
  bblanchon/ArduinoJson@6.18.5

[env:home-esp8266]
platform = espressif8266@4.2.1
framework = arduino
board = d1_mini_lite
board_build.mcu = esp8266
board_build.filesystem = littlefs
lib_deps = 
  apps/home-victor
build_flags = 
  ${env.build_flags}
  ; firmware config
  '-D VICTOR_FIRMWARE_SERVICE="ESP8266 Common"'
  '-D VICTOR_FIRMWARE_VERSION="23.1.20"'
  -D VICTOR_FEATURES_WEB=1
  -D VICTOR_FEATURES_RADIO=1

[env:home-esp32]
platform = espressif32@6.12.0
framework = arduino
board = esp32doit-devkit-v1
board_build.mcu = esp32
board_build.filesystem = littlefs
lib_deps = 
  apps/home-victor
  homespan/HomeSpan@^1.8.0

[env:home-esp32c3]
